<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./store.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"><h1>clearstock</h1></div>
            <div class="navigate">
                <a href=""><i class="fa-regular fa-house"></i></a>                </a>
                <a href="" class="clicked"><i class="fa-solid fa-store"></i></a>
                <a href=""><i class="fa-regular fa-message"></i></a>
            </div>
            <div class="profile"><i class="fa-solid fa-user"></i></div>
        </div>
        <div class="store-container">
            <div class="left-menu">
                <div class="marketplace">
                    <div class="search">
                        <div class="search-title">
                            <h2>Marketplace</h2>
                        </div>
                        <form action="">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" placeholder="what do you want to buy?">
                        </form>
                    </div>
                    <div class="options">
                        <button>
                            <div><i class="fa-solid fa-shop"></i> <span>Browse all</span></div>
                        </button>
                        <button>
                            <div><i class="fa-solid fa-cart-shopping"></i> <span>Buying</span></div>
                            <span><i class="fa-solid fa-angle-right"></i></span>
                        </button>
                        <button>
                            <div><i class="fa-solid fa-tag"></i> <span>Selling</span></div>
                            <span><i class="fa-solid fa-angle-right"></i></span>
                        </button>
                    </div>
                    <div class="horizontal-line"></div>
                </div>
                <div class="categories">
                    <h3>Categories</h3>
                    <button>Vehicles</button>
                    <button>Property for rent</button>
                    <button>Classifieds</button>
                    <button>Clothing</button>
                    <button>Electronics</button>
                </div>
            </div>
            <div class="right-container">
                <h3>Today's picks</h3>
                <div class="stock-container">
                    <div class="stock">
                        <div class="img">
                            <img src="./assets/images (1).jpeg" alt="">
                        </div>
                        <div class="info">
                            <div>
                                <p>s23 ultra</p>
                                <p>Surat, GJ</p>
                            </div>
                            <h3>₹35,000</h3>
                        </div>
                    </div>
                    <div class="stock">
                        <div class="img">
                            <img src="./assets/images (1).jpeg" alt="">
                        </div>
                        <div class="info">
                            <div>
                                <p>s23 ultra</p>
                                <p>Surat, GJ</p>
                            </div>
                            <h3>₹35,000</h3>
                        </div>
                    </div>
                    <div class="stock">
                        <div class="img">
                            <img src="./assets/images (1).jpeg" alt="">
                        </div>
                        <div class="info">
                            <div>
                                <p>s23 ultra</p>
                                <p>Surat, GJ</p>
                            </div>
                            <h3>₹35,000</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
