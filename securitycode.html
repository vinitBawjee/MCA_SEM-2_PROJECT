<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./securitycode.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="securitycode-header">
            <h1>clearstock</h1>
        </div>
        <div class="securitycode-form">
            <div class="title">
                <h2>Enter security code</h2>
            </div>
            <div class="form">
                <p>Please check your phone for a text message with your code.Your code is 6 characters in length.</p>
                <div class="row">
                    <form action="">
                        <div class="input-field">
                            <input type="text" placeholder="Enter code">
                            <span></span>
                        </div>
                    </form>
                    <div class="number">
                        <p>We sent your code to:</p>
                        <span>+919998748019</span>
                    </div>
                </div>
                
            </div>
            <div class="button">
                <a href="">Didn't get a code?</a>
                <div>
                    <button>cancle</button>
                    <button>continue</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
